<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>付费解锁 - 标准数据包</title>
<style>
body{font-family:-apple-system,sans-serif;max-width:600px;margin:40px auto;padding:20px;background:#fafafa}
.card{background:#fff;border-radius:16px;padding:30px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{color:#1a1a1a;font-size:1.4rem}
.price-display{font-size:3rem;font-weight:bold;color:#ff6b35;text-align:center;margin:20px 0}
.steps{background:#f8f9fa;border-radius:12px;padding:20px;margin:20px 0}
.step{display:flex;align-items:flex-start;margin:12px 0}
.step-num{width:28px;height:28px;border-radius:50%;background:#ff6b35;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;margin-right:12px;flex-shrink:0}
.qr-area{text-align:center;margin:30px 0;padding:20px;background:#fff8f0;border:2px dashed #ff6b35;border-radius:12px}
.btn-confirm{display:block;width:100%;padding:14px;background:#ff6b35;color:#fff;border:none;border-radius:8px;font-size:1.1rem;font-weight:bold;cursor:pointer;margin-top:20px}
.btn-confirm:hover{background:#e55a2b}
</style>
</head>
<body>
<div class="card">
  <h1>🔐 解锁 标准数据包</h1>
  <p style="color:#666">10,000条全行业中标公告 + 地区分布</p>
  
  <div class="price-display">¥99.0</div>
  
  <div class="steps">
    <h3>付款步骤（30秒完成）：</h3>
    <div class="step"><div class="step-num">1</div><div>点击下方按钮打开支付宝，扫码支付 ¥99.0</div></div>
    <div class="step"><div class="step-num">2</div><div>支付完成后自动跳转到确认页（或手动点下面按钮）</div></div>
    <div class="step"><div class="step-num">3</div><div>输入你的邮箱 → 30分钟内收到完整数据下载链接</div></div>
  </div>
  
  <div class="qr-area">
    <p style="font-weight:bold;margin-bottom:10px">💳 支付宝扫码支付</p>
    <p style="font-size:.9rem;color:#666">订单号：<code>PD-20261118230043-4BC0E3</code>（保留此号用于售后）</p>
    <button class="btn-confirm" onclick="window.open('https://qr.alipay.com/final?amount=9900&orderid=PD-20261118230043-4BC0E3','_blank')">
      🔗 打开支付宝付款
    </button>
  </div>
  
  <div style="text-align:center;margin-top:20px">
    <a href="/preview/standard.html" style="color:#999;font-size:.9rem">← 返回预览</a>
  </div>
  
  <p style="margin-top:30px;font-size:.8rem;color:#999;text-align:center">
    付款后请把支付宝交易截图发送到 <a href="mailto:orders@example.com?subject=付款确认-standard-PD-20261118230043-4BC0E3">orders@example.com</a><br>
    我们会在你的邮箱发送数据下载链接（24小时内有效）
  </p>
</div>
</body>
</html>
