    border-radius: 10px;

const empty = document.getElementById('empty');
const searchInput = document.getElementById('search');
const visibleCount = document.getElementById('visible-count');

const subjects = new Set();
const provinces = new Set();
DATA.forEach(d => {
  if (d.subject) subjects.add(d.subject);
  if (d.province) provinces.add(d.province);
});
document.getElementById('stat-enterprises').textContent = subjects.size;
document.getElementById('stat-domains').textContent = DATA.length;
document.getElementById('stat-provinces').textContent = provinces.size;

function render(rows) {
  tbody.innerHTML = '';
  if (rows.length === 0) {
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    const frag = document.createDocumentFragment();
    rows.forEach(d => {
      const tr = document.createElement('tr');
      tr.dataset.domain = d.domain.toLowerCase();
      tr.dataset.subject = d.subject.toLowerCase();
      tr.innerHTML =
        '<td class="domain"></td><td></td><td></td><td></td>';
      const tds = tr.querySelectorAll('td');
      tds[0].textContent = d.domain;
      tds[1].textContent = d.subject;
      tds[2].textContent = d.number;
      tds[3].textContent = d.province;
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
  }
  visibleCount.textContent = rows.length;
}

function filter(q) {
  q = q.trim().toLowerCase();
  if (!q) return DATA.slice();
  return DATA.filter(d =>
    d.domain.toLowerCase().includes(q) ||
    d.subject.toLowerCase().includes(q)
  );
}
