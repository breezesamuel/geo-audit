const TOTAL_AMOUNT = 7185502152.370003;

const tbody = document.getElementById('tbody');
const empty = document.getElementById('empty');
const searchInput = document.getElementById('search');
const visibleCount = document.getElementById('visible-count');

const suppliers = new Set();
const regions = new Set();
DATA.forEach(d => {
  if (d.supplier) suppliers.add(d.supplier);
  if (d.region) regions.add(d.region);
});
document.getElementById('stat-records').textContent = DATA.length;
document.getElementById('stat-suppliers').textContent = suppliers.size;
document.getElementById('stat-regions').textContent = regions.size;
document.getElementById('stat-total').textContent = '¥' + (TOTAL_AMOUNT / 1e8).toFixed(2) + ' 亿';

function fmtAmount(raw) {
  if (!raw) return '—';
  const n = parseFloat(raw);
  if (isNaN(n)) return raw;
  if (n >= 1e8) return (n / 1e8).toFixed(2) + ' 亿';
  if (n >= 1e4) return (n / 1e4).toFixed(1) + ' 万';
  return n.toFixed(0);
}

function render(rows) {
  tbody.innerHTML = '';
  if (rows.length === 0) {
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    const frag = document.createDocumentFragment();
    rows.forEach(d => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td class="supplier"></td><td></td><td class="amount"></td><td></td><td></td>';
      const tds = tr.querySelectorAll('td');
      tds[0].textContent = d.supplier;
      tds[1].textContent = d.title;
      tds[2].textContent = fmtAmount(d.amount);
      tds[3].textContent = d.region;
      tds[4].textContent = d.webdate ? d.webdate.substring(0, 10) : '—';
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
  }
  visibleCount.textContent = rows.length;
}

function filter(q) {
  q = q.trim().toLowerCase();
  if (!q) return DATA;
  return DATA.filter(d =>
    d.supplier.toLowerCase().includes(q) ||
    d.title.toLowerCase().includes(q)
  );
}

searchInput.addEventListener('input', () => render(filter(searchInput.value)));
render(DATA);
</script>
